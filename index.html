<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmos — Write an OS in modern C#</title>
  <meta name="description" content="Cosmos is an open-source C# operating system framework. Author your kernel in C# 14, compile it with NativeAOT, and boot it on bare metal — x64 or ARM64.">
  <link rel="icon" href="/favicon.ico">
  <script>
    // Runs before first paint: mark JS as available (reveal-on-scroll only
    // hides content under html.js) and apply the stored theme to avoid a
    // dark-theme flash for light-mode visitors.
    document.documentElement.classList.add('js');
    try {
      if (localStorage.getItem('cosmos-theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch {}
  </script>
</head>
<body data-screen-label="01 Cosmos Gen3 Marketing Site">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
