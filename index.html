<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmos — Write an OS in modern C#</title>
  <meta name="description" content="Cosmos is an open-source C# operating system framework. Author your kernel in C# 14, compile it with NativeAOT, and boot it on bare metal — x64 or ARM64.">
  <link rel="icon" href="/favicon.ico">
  <script>
    // Runs before first paint: mark JS as available (reveal-on-scroll only
    // hides content under html.js), apply the stored theme — falling back to
    // the OS color scheme on first visit — to avoid a wrong-theme flash, and
    // restore the animation-pause toggle.
    document.documentElement.classList.add('js');
    try {
      var t = localStorage.getItem('cosmos-theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      var m = localStorage.getItem('cosmos-motion');
      if (m === 'off' || m === 'on') document.documentElement.dataset.motion = m;
    } catch {}
  </script>
</head>
<body data-screen-label="01 Cosmos Gen3 Marketing Site">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
