name: Deploy
on:
  # Manual trigger from the Actions UI (first deploy, redeploy without a commit)
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: deploy
    # Build needs node; overrides the runner's default docker:cli image
    container: node:22-bookworm
    steps:
      - name: Clone and build
        run: |
          set -e
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.amnesia.cloud/${{ github.repository }}.git"
          git clone --depth 1 --branch master "$REPO_URL" site
          cd site
          npm ci
          npm run build

      - name: Push html/ to gocosmos.org over FTP
        env:
          FTP_HOST: 000.web.punksky.com
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Adjust if punksky's docroot differs (htdocs, www, ...)
          FTP_DOCROOT: public_html
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq rclone
          # rclone (Go TLS) instead of lftp: this server breaks the gnutls
          # session right after PASS. sync mirrors html/ and prunes stale
          # hashed assets so the 256 MB quota never fills.
          # no_check_certificate: the server's Let's Encrypt cert is expired.
          export RCLONE_CONFIG_DEPLOY_TYPE=ftp
          export RCLONE_CONFIG_DEPLOY_HOST="$FTP_HOST"
          export RCLONE_CONFIG_DEPLOY_USER="$FTP_USER"
          export RCLONE_CONFIG_DEPLOY_PASS="$(rclone obscure "$FTP_PASSWORD")"
          export RCLONE_CONFIG_DEPLOY_EXPLICIT_TLS=true
          export RCLONE_CONFIG_DEPLOY_NO_CHECK_CERTIFICATE=true
          rclone sync site/html "deploy:$FTP_DOCROOT" -v --transfers 2
