name: Deploy
on:
  # Manual trigger from the Actions UI (first deploy, redeploy without a commit)
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: deploy
    # Build needs node; overrides the runner's default docker:cli image
    container: node:22-bookworm
    steps:
      - name: Clone and build
        run: |
          set -e
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.amnesia.cloud/${{ github.repository }}.git"
          git clone --depth 1 --branch master "$REPO_URL" site
          cd site
          npm ci
          npm run build

      - name: Push html/ to gocosmos.org over FTP
        env:
          FTP_HOST: 000.web.punksky.com
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Adjust if punksky's docroot differs (htdocs, www, ...)
          FTP_DOCROOT: public_html
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq lftp
          # --delete prunes stale hashed assets so the 256 MB quota never fills;
          # it also removes anything else in the docroot not present in html/.
          # verify-certificate off: the server's Let's Encrypt cert is expired.
          # TLS 1.2 forced: lftp/gnutls fails TLS 1.3 session reuse on the data
          # channel with this server (gnutls_record_recv: unexpected TLS packet).
          # -d: full FTP/TLS dialogue in the log (lftp masks the password)
          lftp -d -u "$FTP_USER,$FTP_PASSWORD" "$FTP_HOST" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:priority NORMAL:-VERS-TLS1.3;
            set ssl:verify-certificate no;
            mirror -R --delete site/html/ $FTP_DOCROOT/;
            quit"
