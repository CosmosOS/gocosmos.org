<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Holding page only — keep it out of search indexes until launch. -->
  <meta name="robots" content="noindex">
  <title>Cosmos — Site under construction</title>
  <meta name="description" content="The new Cosmos website is under construction.">
  <link rel="icon" href="/favicon.ico">
  <script>
    // Same pre-paint script as the main site: apply the stored theme —
    // falling back to the OS color scheme — and the animation-pause toggle,
    // so a visitor's choice carries over to the holding page.
    try {
      var t = localStorage.getItem('cosmos-theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      var m = localStorage.getItem('cosmos-motion');
      if (m === 'off' || m === 'on') document.documentElement.dataset.motion = m;
    } catch {}
  </script>
  <style>
    /* Standalone page: tokens and the glass surface are copied from
       src/styles/ so it ships without the app bundle. Light mode stays
       monochrome (accent = fg). */
    :root {
      --bg-0: #0A0A0F;
      --fg-1: #F5F5FA;
      --fg-2: #A0A0B5;
      --accent: #F2EBDA;
      --line: rgba(242, 235, 218, 0.28);
      --font-sans: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    [data-theme='light'] {
      --bg-0: #FFFFFF;
      --fg-1: #0A0A0F;
      --fg-2: #4A4A5C;
      --accent: #0A0A0F;
      --line: #E0E0E8;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg-0);
      color: var(--fg-1);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Static slice of the site's starfield: two nebulae, a galaxy glow, three
       tiled star layers in the logo palette (cream / ice blue / white). */
    .stars {
      position: fixed; inset: 0;
      z-index: -2; pointer-events: none;
      background-image:
        radial-gradient(ellipse 45% 35% at 25% 30%, rgba(120, 95, 180, 0.12), transparent 70%),
        radial-gradient(ellipse 38% 30% at 78% 65%, rgba(70, 130, 180, 0.10), transparent 70%),
        radial-gradient(ellipse 18% 14% at 82% 16%, rgba(242, 235, 218, 0.10), transparent 70%),
        radial-gradient(1.4px 1.4px at 30px 40px, rgba(245, 245, 250, 0.95), transparent 60%),
        radial-gradient(1.8px 1.8px at 160px 110px, rgba(242, 235, 218, 0.85), transparent 60%),
        radial-gradient(1px 1px at 110px 200px, rgba(180, 200, 230, 0.75), transparent 60%),
        radial-gradient(1px 1px at 230px 60px, rgba(245, 245, 250, 0.60), transparent 60%),
        radial-gradient(1.2px 1.2px at 70px 140px, rgba(180, 200, 230, 0.65), transparent 60%),
        radial-gradient(0.9px 0.9px at 190px 180px, rgba(245, 245, 250, 0.45), transparent 60%);
      background-size:
        100% 100%, 100% 100%, 100% 100%,
        270px 270px, 350px 350px, 240px 240px, 300px 300px, 210px 210px, 330px 330px;
      background-repeat:
        no-repeat, no-repeat, no-repeat,
        repeat, repeat, repeat, repeat, repeat, repeat;
    }
    [data-theme='light'] .stars { display: none; }

    /* Background saucer — above the starfield, behind the page, so it drifts
       blurred beneath the glass pane. Position is driven by the script below;
       without JS or with reduced motion it stays parked off-screen. */
    .ufo {
      position: fixed; top: 0; left: 0;
      width: 104px; height: 40px;
      /* 29-frame strip is 3770x50 natively; shown at 80% (cells 104x40) */
      background: url('/assets/ufo-sprite.webp') 0 0 / 3016px 40px no-repeat;
      z-index: -1; pointer-events: none;
      will-change: transform;
      opacity: 0.85;
    }
    [data-theme='light'] .ufo { display: none; }

    main { width: 100%; max-width: 38rem; }

    /* Glass surface, copied from the site's glass system (minus the
       cursor-tracked edge glint — nothing on this page drives it). */
    .glass.glass {
      position: relative;
      overflow: visible;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 45%, rgba(255, 255, 255, 0.06) 100%),
        rgba(22, 22, 30, 0.42);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.18),
        0 8px 24px rgba(0, 0, 0, 0.30);
    }
    [data-theme='light'] .glass.glass {
      border-color: rgba(20, 20, 35, 0.10);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.55) 45%, rgba(255, 255, 255, 0.72) 100%),
        rgba(255, 255, 255, 0.30);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.90),
        0 8px 24px rgba(25, 25, 50, 0.08);
    }
    /* UFO underglow — the purple sheen that sweeps the pane as the saucer
       passes behind it (vars set by the script). Dark mode only. */
    .glass.glass::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: radial-gradient(170px circle at var(--ufo-x, 50%) var(--ufo-y, 220%),
        rgba(190, 170, 230, 0.20), rgba(190, 170, 230, 0.06) 45%, transparent 70%);
      opacity: var(--ufo-o, 0);
      pointer-events: none;
    }
    [data-theme='light'] .glass.glass::before { display: none; }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass.glass { background: rgba(22, 22, 30, 0.92); }
      [data-theme='light'] .glass.glass { background: rgba(255, 255, 255, 0.94); }
    }

    .term {
      border-radius: 10px;
      padding: clamp(1.25rem, 5vw, 2rem);
    }
    .term-cmd {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--fg-2);
      overflow-wrap: break-word;
    }
    .term-user { color: var(--accent); }
    .term-out {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--fg-2);
      margin-top: 0.35rem;
    }
    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
    }
    /* Blink honors both kill switches: OS reduced motion and the site's
       pause toggle (data-motion, restored from storage above). */
    @media (prefers-reduced-motion: no-preference) {
      html:not([data-motion='off']) .cursor { animation: blink 1.1s steps(1) infinite; }
    }
    [data-motion='on'] .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    h1 {
      margin: 1.5rem 0 0.5rem;
      font-size: clamp(1.5rem, 6vw, 2.1rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    p { color: var(--fg-2); font-size: 0.95rem; }
    .meanwhile {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    a {
      color: var(--fg-1);
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow-wrap: break-word;
    }
    a:hover { color: var(--accent); }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="ufo" aria-hidden="true" style="transform: translate3d(-200px, 160px, 0)"></div>
  <main>
    <div class="term glass">
      <div class="term-cmd" aria-hidden="true">
        <span class="term-user">cosmos@gen3</span>:<span>~</span>$ ./launch gocosmos.org
      </div>
      <div class="term-out" aria-hidden="true">[▓▓▓▓░░░░░░] building… <span class="cursor"></span></div>
      <h1>Site under construction</h1>
      <p>The new Cosmos website is being built and isn’t public yet. Check back soon.</p>
      <p class="meanwhile">In the meantime, Cosmos is on GitHub:<br>
        <a href="https://github.com/CosmosOS/Cosmos">github.com/CosmosOS/Cosmos</a>
      </p>
    </div>
  </main>
  <script>
    // Vanilla port of the site's Ufo.tsx: wander between random waypoints,
    // occasionally dart off to hover above the cursor, and sweep the glass
    // pane with the purple underglow while passing behind it. The pane
    // contains a link, so per the site's rules it gets the glow but never
    // the tractor-beam tug (a moving click target is a WCAG 2.2.2 problem).
    (function () {
      var el = document.querySelector('.ufo');
      var pane = document.querySelector('.glass');
      if (!el || !pane) return;

      var FRAMES = 29, CELL_W = 104, CELL_H = 40, FRAME_MS = 110;
      var REACH = 240;

      function motionOff() {
        var m = document.documentElement.dataset.motion;
        if (m === 'off') return true;
        if (m === 'on') return false;
        return matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      var raf = 0, last = 0, frame = 0, frameAcc = 0;
      var x = -CELL_W, y = 0, vx = 0, vy = 0, tx = 0, ty = 0;
      var mode = 'wander', modeUntil = 0;
      var mouseX = 0, mouseY = 0, hasMouse = false;
      var rect = null, rectAt = -1e9, glow = 0;

      function pickWaypoint() {
        tx = 40 + Math.random() * Math.max(window.innerWidth - CELL_W - 80, 100);
        ty = 30 + Math.random() * (window.innerHeight * 0.7);
      }
      function invalidate() { rectAt = -1e9; }
      window.addEventListener('pointermove', function (e) {
        mouseX = e.clientX; mouseY = e.clientY; hasMouse = true;
      }, { passive: true });
      window.addEventListener('resize', invalidate);
      window.addEventListener('scroll', invalidate, { passive: true });

      function tick(t) {
        if (motionOff()) { stop(); return; }
        var dt = Math.min((t - last) / 1000, 0.05);
        last = t;

        frameAcc += dt * 1000;
        while (frameAcc >= FRAME_MS) { frameAcc -= FRAME_MS; frame = (frame + 1) % FRAMES; }

        if (t > modeUntil) {
          if (mode === 'wander' && hasMouse && Math.random() < 0.4) {
            mode = 'chase';
            modeUntil = t + 2500 + Math.random() * 2500;
          } else {
            mode = 'wander';
            pickWaypoint();
            modeUntil = t + 4000 + Math.random() * 5000;
          }
        }

        var chasing = mode === 'chase';
        var targetX = chasing ? mouseX - CELL_W / 2 : tx;
        var targetY = chasing ? mouseY - CELL_H - 36 : ty;

        // Spring toward the target with drag, then cap speed — wandering is
        // lazy, the attack run is a dart.
        var spring = chasing ? 4.5 : 1.2;
        vx += (targetX - x) * spring * dt;
        vy += (targetY - y) * spring * dt;
        var drag = Math.exp(-dt * (chasing ? 1.4 : 1.8));
        vx *= drag; vy *= drag;
        var cap = chasing ? 560 : 150;
        var speed = Math.hypot(vx, vy);
        if (speed > cap) { vx = vx / speed * cap; vy = vy / speed * cap; }
        x += vx * dt;
        y += vy * dt;
        x = Math.max(-CELL_W / 2, Math.min(x, window.innerWidth - CELL_W / 2));
        y = Math.max(8, Math.min(y, window.innerHeight - CELL_H - 8));
        if (!chasing && Math.hypot(tx - x, ty - y) < 24) pickWaypoint();

        var bank = Math.max(-12, Math.min(12, vx * 0.025));
        var bob = Math.sin(t / 650) * 3;
        el.style.transform = 'translate3d(' + x.toFixed(1) + 'px, ' + (y + bob).toFixed(1) + 'px, 0) rotate(' + bank.toFixed(1) + 'deg)';
        el.style.backgroundPosition = (-frame * CELL_W) + 'px 0';

        // Underglow — decays to zero in light mode, where the saucer is hidden.
        if (t - rectAt > 250) { rect = pane.getBoundingClientRect(); rectAt = t; }
        var scx = x + CELL_W / 2, scy = y + CELL_H / 2;
        var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
        var active = document.documentElement.dataset.theme !== 'light';
        var strength = active ? Math.max(0, 1 - Math.hypot(scx - cx, scy - cy) / REACH) : 0;
        if (strength >= 0.005 || glow >= 0.005) {
          pane.style.setProperty('--ufo-x', (((scx - rect.left) / rect.width) * 100).toFixed(1) + '%');
          pane.style.setProperty('--ufo-y', (((scy - rect.top) / rect.height) * 100).toFixed(1) + '%');
          pane.style.setProperty('--ufo-o', strength.toFixed(3));
        }
        glow = strength;

        raf = requestAnimationFrame(tick);
      }

      function start() {
        last = performance.now();
        y = window.innerHeight * 0.25;
        pickWaypoint();
        modeUntil = last + 4000 + Math.random() * 4000;
        raf = requestAnimationFrame(tick);
      }
      function stop() {
        cancelAnimationFrame(raf);
        // Park off-screen so a mid-flight pause doesn't freeze the saucer
        // over the page.
        el.style.transform = 'translate3d(-200px, 160px, 0)';
        pane.style.removeProperty('--ufo-o');
      }

      matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', function () {
        stop();
        if (!motionOff()) start();
      });
      if (!motionOff()) start();
    })();
  </script>
</body>
</html>
