name: Deploy
on:
  # Manual trigger from the Actions UI (first deploy, redeploy without a commit)
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      # UNDER CONSTRUCTION: production only gets the holding page (the full
      # site still builds above as a compile check, and local docker compose
      # still serves it). To launch, sync html/ instead of live/.
      - name: Push holding page to gocosmos.org over SFTP
        env:
          SFTP_HOST: 000.web.punksky.com
          SFTP_USER: ${{ secrets.FTP_USER }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_DOCROOT: web/gocosmos.org/public_html
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          # SFTP, not FTP: punksky's FTP backend can't enter this account's
          # jail (500 OOPS: cannot change directory:/srv/jail/<user>) and
          # drops TLS right after PASS, which killed both lftp and rclone.
          # The same credentials work over SSH on port 22, where the docroot
          # is web/gocosmos.org/public_html. sync mirrors the source dir and
          # prunes everything else, so the built site never leaks to prod.
          mkdir -p live/assets
          cp html/under-construction.html live/index.html
          cp html/favicon.ico live/
          # The holding page's saucer sprite (from public/assets)
          cp html/assets/ufo-sprite.webp live/assets/
          # Matrix federation + client discovery (public/.well-known/matrix):
          # must survive the sync prune or gocosmos.org federation breaks
          cp -r html/.well-known live/
          export RCLONE_CONFIG_DEPLOY_TYPE=sftp
          export RCLONE_CONFIG_DEPLOY_HOST="$SFTP_HOST"
          export RCLONE_CONFIG_DEPLOY_USER="$SFTP_USER"
          export RCLONE_CONFIG_DEPLOY_PASS="$(rclone obscure "$SFTP_PASSWORD")"
          rclone sync live "deploy:$SFTP_DOCROOT" -v --transfers 2
