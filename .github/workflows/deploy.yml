name: Deploy
on:
  # Manual trigger from the Actions UI (first deploy, redeploy without a commit)
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Push site to gocosmos.org over SFTP
        env:
          SFTP_HOST: 000.web.punksky.com
          SFTP_USER: ${{ secrets.FTP_USER }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_DOCROOT: web/gocosmos.org/public_html
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
          # SFTP, not FTP: punksky's FTP backend can't enter this account's
          # jail (500 OOPS: cannot change directory:/srv/jail/<user>) and
          # drops TLS right after PASS, which killed both lftp and rclone.
          # The same credentials work over SSH on port 22, where the docroot
          # is web/gocosmos.org/public_html.
          export RCLONE_CONFIG_DEPLOY_TYPE=sftp
          export RCLONE_CONFIG_DEPLOY_HOST="$SFTP_HOST"
          export RCLONE_CONFIG_DEPLOY_USER="$SFTP_USER"
          export RCLONE_CONFIG_DEPLOY_PASS="$(rclone obscure "$SFTP_PASSWORD")"
          # sync mirrors the whole build and prunes whatever else is in the
          # docroot. Matrix federation + client discovery ships as part of the
          # build (public/.well-known/matrix), so it survives the prune.
          # --delete-after keeps the old assets in place until the new build is
          # fully uploaded: index.html names hash-stamped bundles, so pruning
          # mid-transfer would break the page for anyone loading it just then.
          rclone sync html "deploy:$SFTP_DOCROOT" -v --transfers 2 --delete-after
